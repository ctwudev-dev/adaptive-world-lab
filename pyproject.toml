[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-world-lab"
version = "2.0.0"
description = "Robot physics learning from force-driven planar contact, with paired evaluation and explicit learning costs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
mujoco = ["mujoco>=3.3,<4"]
test = ["pytest>=8,<10"]
proposal = ["reportlab>=4,<5"]

[project.scripts]
awm = "awm.cli:main"

[tool.setuptools]
packages = ["awm"]
