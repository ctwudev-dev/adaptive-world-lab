<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Adaptive World Lab</title>
<desc id="desc">A box slides toward a target. The controller observes motion, updates its friction estimate, and plans its next move.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111b27"/><stop offset="1" stop-color="#0d1116"/></linearGradient></defs>
<rect width="1200" height="420" rx="18" fill="url(#bg)"/>
<g font-family="Arial, sans-serif">
<text x="48" y="55" font-size="13" letter-spacing="3" fill="#ffb068">ADAPTIVE WORLD LAB</text>
<text x="48" y="106" font-size="36" font-weight="700" fill="#e7edf5">A model that learns from each move.</text>
<text x="48" y="141" font-size="17" fill="#9babbe">Predict a stop. Observe the motion. Update the friction estimate.</text>
<rect x="48" y="184" width="720" height="100" rx="8" fill="#172431" stroke="#334457"/>
<path d="M128 185v98m80-98v98m80-98v98m80-98v98m80-98v98m80-98v98m80-98v98m80-98v98" stroke="#263646"/>
<rect x="635" y="190" width="70" height="88" rx="3" fill="#72d4bd" fill-opacity=".12" stroke="#72d4bd" stroke-dasharray="5 5"/>
<text x="670" y="175" text-anchor="middle" font-size="14" fill="#72d4bd">Target</text>
<rect x="475" y="191" width="104" height="86" fill="#ffb068" fill-opacity=".07" stroke="#ffb068" stroke-opacity=".4" stroke-dasharray="4 5"/>
<path d="M231 234h220" stroke="#ffb068" stroke-width="2" stroke-dasharray="6 7"/>
<path d="m439 228 12 6-12 6" fill="none" stroke="#ffb068" stroke-width="2"/>
<rect x="174" y="210" width="48" height="48" rx="5" fill="#ffb068" stroke="#ffcf9e"/>
<rect x="188" y="224" width="20" height="20" rx="2" fill="#bd7947"/>
<text x="198" y="307" text-anchor="middle" font-size="14" fill="#9babbe">Box</text>
<text x="527" y="307" text-anchor="middle" font-size="14" fill="#9babbe">Predicted stop range</text>
<g transform="translate(820 184)">
<rect width="332" height="134" rx="10" fill="#141f2b" stroke="#334457"/>
<text x="22" y="34" font-size="16" font-weight="700" fill="#e7edf5">Observe → Update → Plan</text>
<text x="22" y="68" font-size="14" fill="#9babbe">Keep a range of friction values.</text>
<text x="22" y="94" font-size="14" fill="#9babbe">Use new evidence to narrow it.</text>
</g>
<text x="48" y="377" font-size="15" fill="#9babbe">4 strategies  ·  2 physics engines  ·  1,200 saved simulation runs</text>
<text x="1152" y="377" text-anchor="end" font-size="13" fill="#70839a">1D SLIDING PROTOTYPE</text>
</g></svg>
